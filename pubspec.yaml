name: altin_takip
description: Altın Takip - Türkiye altın fiyatlarını takip uygulaması.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  fl_chart: ^0.69.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Android ikonu (CI içinde `dart run flutter_launcher_icons` ile üretilir).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A0C11"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
