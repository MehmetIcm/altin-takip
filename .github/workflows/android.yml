name: Android (APK ve AAB)

# Elle çalıştırılır: Actions > "Android (APK ve AAB)" > Run workflow
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android platformunu hazırla
        run: |
          if [ ! -d android ]; then
            flutter create --org com.altintakip --project-name altin_takip --platforms=android /tmp/scaffold
            cp -R /tmp/scaffold/android ./android
          fi
          python3 tool/patch_android.py

      # Secret'lar tanımlıysa gerçek (Play'e yüklenebilir) imza kullanılır.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Gerçek imza anahtarı kullanılacak."
          else
            echo "::warning::İmza secret'ları tanımlı değil. Çıktı debug anahtarıyla imzalanır: telefona kurulabilir ama Google Play'e YÜKLENEMEZ."
          fi

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter test

      - name: APK ve AAB derle
        run: |
          PRIVACY="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/gizlilik.html"
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=PRIVACY_URL=$PRIVACY
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=PRIVACY_URL=$PRIVACY

      - uses: actions/upload-artifact@v4
        with:
          name: altin-takip-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
