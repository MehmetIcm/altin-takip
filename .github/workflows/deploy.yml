name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Web platformu, ikonlar ve gizlilik sayfası
      - name: Web dosyalarını hazırla
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --platforms=web --project-name altin_takip /tmp/scaffold
            cp -R /tmp/scaffold/web ./web
          fi
          cp -R web_extras/. web/
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s#__REPO_URL__#${REPO_URL}#g" web/gizlilik.html
          sed -i 's#<title>altin_takip</title>#<title>Altın Takip</title>#; s#A new Flutter project.#Güncel altın fiyatları, portföy ve hesaplama araçları.#' web/index.html
          sed -i 's#"name": "altin_takip"#"name": "Altın Takip"#; s#"short_name": "altin_takip"#"short_name": "Altın Takip"#' web/manifest.json

      - run: flutter pub get
      - run: flutter test
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=PRIVACY_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/gizlilik.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
